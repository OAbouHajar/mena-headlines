name: AI Summary Cron

on:
  schedule:
    - cron: '0 12 * * *'  # Once a day at 12:00 GMT
  workflow_dispatch: {}     # Allow manual trigger

jobs:
  warm_ai_summary:
    runs-on: ubuntu-latest
    steps:
      - name: Warm AI Intelligence Summary (AR)
        run: |
          curl -sf -X POST \
            "${{ secrets.SWA_URL }}/api/intelligence" \
            -H "Content-Type: application/json" \
            -d '{"lang":"ar","historyIndex":0}' \
            --max-time 120 || echo "Request failed (non-critical)"
      - name: Warm AI Intelligence Summary (EN)
        run: |
          curl -sf -X POST \
            "${{ secrets.SWA_URL }}/api/intelligence" \
            -H "Content-Type: application/json" \
            -d '{"lang":"en","historyIndex":0}' \
            --max-time 120 || echo "Request failed (non-critical)"
